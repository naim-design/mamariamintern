<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk — Intern Sales Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/intern-sales.css?v=2">
  <script>
    (function(){const t=localStorage.getItem('internTheme')||'dark';if(t==='light')document.documentElement.setAttribute('data-theme','light');})();
  </script>
</head>
<body class="auth-body">
  <button class="theme-fab" id="theme-toggle" aria-label="Tukar tema">🌙</button>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-logo-wrap"><img src="assets/logo-red.png" alt="Mamariam"></div>
      <div class="eyebrow">INTERN SALES TRACKER</div>
      <h1>Pantau sales intern dengan lebih jelas.</h1>
      <p class="auth-copy">Rekod sales Live & WhatsApp, tengok pencapaian target bulanan, dan tahu berapa lagi perlu dikejar.</p>
      <div id="login-screen" class="auth-screen active">
        <div id="auth-error" class="auth-alert"></div>
        <form id="login-form" class="stack-form">
          <label>Email<input type="email" id="login-email" autocomplete="email" required></label>
          <label>Password<input type="password" id="login-password" autocomplete="current-password" required></label>
          <button class="btn btn-primary" type="submit">Log Masuk</button>
        </form>
        <button class="text-btn" id="show-reset" type="button">Lupa password?</button>
      </div>
      <div id="reset-screen" class="auth-screen">
        <div id="reset-message" class="auth-alert"></div>
        <form id="reset-form" class="stack-form">
          <label>Email<input type="email" id="reset-email" autocomplete="email" required></label>
          <button class="btn btn-primary" type="submit">Hantar Link Reset</button>
        </form>
        <button class="text-btn" id="show-login" type="button">← Kembali ke log masuk</button>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js?v=5"></script>
</body>
</html>
